<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>文化祭QRスタンプラリー</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Html5Qrcode -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body { font-family: 'Noto Sans JP', sans-serif; -webkit-tap-highlight-color: transparent; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-24 select-none">

  <!-- ヘッダー -->
  <header class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white p-5 shadow-lg rounded-b-3xl">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold tracking-wide">文化祭スタンプラリー</h1>
        <p class="text-xs text-indigo-100 mt-1">全14箇所（アトラクション・展示物販）で特典！</p>
      </div>
      <div class="bg-white/20 backdrop-blur-md px-4 py-2 rounded-full font-extrabold text-lg shadow-inner">
        <span id="header-stamp-count">0</span> / 14
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="max-w-md mx-auto px-4 mt-6">

    <!-- タブ1: ミッション（ホーム） -->
    <div id="tab-mission" class="tab-content active space-y-6">
      
      <!-- プレイヤー情報カード -->
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 text-center">
        <p class="text-xs text-indigo-500 font-bold uppercase tracking-wider mb-1">参加中のプレイヤー</p>
        <h2 id="player-name-display" class="text-xl font-bold text-slate-800">読み込み中...</h2>
        <div class="mt-2 inline-flex items-center gap-1 bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full text-xs font-semibold">
          <span>周回数:</span> <span id="lap-count-display">1</span> 周目
        </div>
      </div>

      <!-- くじ引き・目的地カード -->
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 text-center relative overflow-hidden">
        <h3 class="text-sm font-bold text-slate-500 mb-3">次の目的地を決める</h3>
        <div id="lottery-display" class="text-2xl font-extrabold text-indigo-600 my-4 min-h-[40px] flex items-center justify-center">
          「くじを引く」を押してください
        </div>
        <button onclick="drawLottery()" id="lottery-btn" class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-bold py-3 px-6 rounded-xl shadow-md hover:opacity-90 active:scale-95 transition-all">
          🎯 くじを引く（ランダム選出）
        </button>
      </div>

      <!-- QRスキャナーカード -->
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 text-center">
        <h3 class="text-sm font-bold text-slate-500 mb-3">スタンプを獲得する</h3>
        <div id="reader-container" class="hidden mb-4 overflow-hidden rounded-xl border-2 border-indigo-200">
          <div id="reader" class="w-full"></div>
        </div>
        <button id="scan-btn" onclick="toggleScanner()" class="w-full bg-slate-800 text-white font-bold py-3 px-6 rounded-xl shadow-md hover:bg-slate-700 active:scale-95 transition-all flex items-center justify-center gap-2">
          <i data-lucide="qr-code"></i>
          <span id="scan-btn-text">カメラを起動してQRを読み取る</span>
        </button>
      </div>

      <!-- リセットボタン -->
      <div class="text-center pt-4 border-t border-slate-200">
        <button onclick="resetTestData()" class="text-xs text-slate-400 hover:text-red-500 underline transition-colors">
          テストデータをリセットして最初からやり直す
        </button>
      </div>
    </div>

    <!-- タブ2: スタンプ帳 -->
    <div id="tab-stamps" class="tab-content space-y-4">
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
        <h2 class="text-lg font-bold text-slate-800 mb-1">スタンプ帳</h2>
        <p class="text-xs text-slate-500 mb-4">獲得したクラスのスタンプが表示されます</p>
        
        <div id="stamps-grid" class="grid grid-cols-2 gap-3">
          <!-- JSで自動生成 -->
        </div>
      </div>
    </div>

    <!-- タブ3: 特典 -->
    <div id="tab-rewards" class="tab-content space-y-4">
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 text-center">
        <div class="w-16 h-16 bg-yellow-100 text-yellow-600 rounded-full flex items-center justify-center mx-auto mb-4">
          <i data-lucide="gift" class="w-8 h-8"></i>
        </div>
        <h2 class="text-xl font-bold text-slate-800 mb-2">コンプリート特典</h2>
        <p class="text-sm text-slate-600 mb-6">全14箇所のスタンプを集めると景品交換チケットが発行されます。</p>
        
        <div id="reward-status-box" class="p-4 rounded-xl bg-slate-100 text-slate-500 font-bold text-sm">
          スタンプを集めて特典を解除しよう！
        </div>
      </div>
    </div>

  </main>

  <!-- 名前入力モダル (初回訪問時) -->
  <div id="name-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl text-center space-y-4">
      <div class="w-14 h-14 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto">
        <i data-lucide="user" class="w-7 h-7"></i>
      </div>
      <h3 class="text-xl font-bold text-slate-800">プレイヤー登録</h3>
      <p class="text-xs text-slate-500">スタンプラリーを開始するために、お名前（またはニックネーム）を入力してください。</p>
      <input type="text" id="name-input" placeholder="例: 一条 太郎" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-center text-slate-800 font-medium">
      <button onclick="saveUserName()" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl shadow-lg hover:bg-indigo-700 active:scale-95 transition-all">
        スタート！
      </button>
    </div>
  </div>

  <!-- 下部ナビゲーションバー -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-6 py-2 z-40">
    <div class="max-w-md mx-auto flex justify-around items-center">
      <button onclick="switchTab('mission')" id="nav-mission" class="flex flex-col items-center gap-1 text-indigo-600 font-bold text-xs py-1">
        <i data-lucide="compass" class="w-6 h-6"></i>
        <span>ミッション</span>
      </button>
      <button onclick="switchTab('stamps')" id="nav-stamps" class="flex flex-col items-center gap-1 text-slate-400 font-bold text-xs py-1">
        <i data-lucide="award" class="w-6 h-6"></i>
        <span>スタンプ帳</span>
      </button>
      <button onclick="switchTab('rewards')" id="nav-rewards" class="flex flex-col items-center gap-1 text-slate-400 font-bold text-xs py-1">
        <i data-lucide="gift" class="w-6 h-6"></i>
        <span>特典</span>
      </button>
    </div>
  </nav>

  <!-- JavaScript -->
  <script>
    // ==========================================
    // 1. 設定 & 14クラス定義
    // ==========================================
    // ★ご自身のGASウェブアプリURLに差し替えてください
    const GAS_URL = "ここにご自身のGASウェブアプリURLを貼り付け"; 

    const SPOTS = [
      { id: 1, name: "1年1組", genre: "attraction", emoji: "🎪", desc: "ミッションをクリアしてスタンプGET！" },
      { id: 2, name: "1年2組", genre: "attraction", emoji: "☕", desc: "ミッションをクリアしてスタンプGET！" },
      { id: 3, name: "1年3組", genre: "attraction", emoji: "🎯", desc: "ミッションをクリアしてスタンプGET！" },
      { id: 4, name: "1年4組", genre: "attraction", emoji: "👻", desc: "ミッションをクリアしてスタンプGET！" },
      { id: 5, name: "1年5組", genre: "food_exhibit", emoji: "🍔", desc: "ミッションをクリアしてスタンプGET！" },
      { id: 6, name: "1年6組", genre: "food_exhibit", emoji: "🎨", desc: "ミッションをクリアしてスタンプGET！" },
      { id: 7, name: "1年7組", genre: "food_exhibit", emoji: "📸", desc: "ミッションをクリアしてスタンプGET！" },
      { id: 8, name: "2年1組", genre: "attraction", emoji: "🎸", desc: "ミッションをクリアしてスタンプGET！" },
      { id: 9, name: "2年2組", genre: "attraction", emoji: "🍿", desc: "ミッションをクリアしてスタンプGET！" },
      { id: 10, name: "2年3組", genre: "attraction", emoji: "🎳", desc: "ミッションをクリアしてスタンプGET！" },
      { id: 11, name: "2年4組", genre: "attraction", emoji: "🍩", desc: "ミッションをクリアしてスタンプGET！" },
      { id: 12, name: "2年5組", genre: "food_exhibit", emoji: "🎬", desc: "ミッションをクリアしてスタンプGET！" },
      { id: 13, name: "2年6組", genre: "food_exhibit", emoji: "🍧", desc: "ミッションをクリアしてスタンプGET！" },
      { id: 14, name: "2年7組", genre: "food_exhibit", emoji: "🎈", desc: "ミッションをクリアしてスタンプGET！" }
    ];

    // ==========================================
    // 2. 状態管理（LocalStorage）
    // ==========================================
    let userName = localStorage.getItem('ichijo_festival_user_name') || '';
    let stamps = JSON.parse(localStorage.getItem('ichijo_festival_stamps') || '[]');
    let currentTargetId = parseInt(localStorage.getItem('ichijo_festival_target_id')) || null;
    let lapCount = parseInt(localStorage.getItem('ichijo_festival_lap_count')) || 1;

    let isDrawing = false;
    let html5QrcodeScanner = null;

    // ==========================================
    // 3. 初期化処理
    // ==========================================
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      
      if (!userName) {
        document.getElementById('name-modal').classList.remove('hidden');
      } else {
        updateUI();
      }
    });

    // ユーザー名保存
    function saveUserName() {
      const input = document.getElementById('name-input').value.trim();
      if (!input) {
        alert("お名前を入力してください。");
        return;
      }
      userName = input;
      localStorage.setItem('ichijo_festival_user_name', userName);
      document.getElementById('name-modal').classList.add('hidden');
      updateUI();
    }

    // 全体画面更新
    function updateUI() {
      // プレイヤー名・各種数値の更新
      document.getElementById('player-name-display').textContent = userName || '未登録';
      document.getElementById('lap-count-display').textContent = lapCount;
      document.getElementById('header-stamp-count').textContent = stamps.length;

      // くじ引き／目的地表示の更新
      const display = document.getElementById('lottery-display');
      if (currentTargetId) {
        const targetSpot = SPOTS.find(s => s.id === currentTargetId);
        if (targetSpot) {
          display.textContent = `目的地: ${targetSpot.name}`;
          display.className = "text-2xl font-extrabold text-indigo-600 my-4 min-h-[40px] flex items-center justify-center";
        }
      } else {
        display.textContent = "「くじを引く」を押してください";
      }

      // スタンプ帳グリッド更新
      renderStampsGrid();

      // 特典状態更新
      renderRewards();
    }

    // ==========================================
    // 4. くじ引き処理 (完全ランダム・連打防止・自動データ送信なし)
    // ==========================================
    function drawLottery() {
      if (isDrawing) return;

      const availableSpots = SPOTS.filter(spot => !stamps.includes(spot.id));
      if (availableSpots.length === 0) {
        alert("すべてのスタンプを獲得済みです！");
        return;
      }

      isDrawing = true;

      // 未獲得から完全ランダム選出
      const randomIndex = Math.floor(Math.random() * availableSpots.length);
      const selectedSpot = availableSpots[randomIndex];

      const display = document.getElementById('lottery-display');
      display.className = "text-2xl font-extrabold text-indigo-500 animate-pulse my-4 min-h-[40px] flex items-center justify-center";

      let count = 0;
      const interval = setInterval(() => {
        const randomSpot = availableSpots[Math.floor(Math.random() * availableSpots.length)];
        display.textContent = randomSpot.name;
        count++;

        if (count > 12) {
          clearInterval(interval);
          currentTargetId = selectedSpot.id;
          localStorage.setItem('ichijo_festival_target_id', currentTargetId.toString());
          display.textContent = `目的地: ${selectedSpot.name}`;
          display.className = "text-2xl font-extrabold text-indigo-600 my-4 min-h-[40px] flex items-center justify-center";
          isDrawing = false;
        }
      }, 80);
    }

    // ==========================================
    // 5. QRスキャナー制御
    // ==========================================
    function toggleScanner() {
      const container = document.getElementById('reader-container');
      const btnText = document.getElementById('scan-btn-text');

      if (html5QrcodeScanner) {
        stopScanner();
      } else {
        container.classList.remove('hidden');
        btnText.textContent = "カメラを停止する";

        html5QrcodeScanner = new Html5Qrcode("reader");
        html5QrcodeScanner.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 220, height: 220 } },
          onScanSuccess,
          onScanFailure
        ).catch(err => {
          console.error("カメラ起動エラー:", err);
          alert("カメラの起動に失敗しました。カメラ権限を許可してください。");
          stopScanner();
        });
      }
    }

    function stopScanner() {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().then(() => {
          html5QrcodeScanner.clear();
          html5QrcodeScanner = null;
          document.getElementById('reader-container').classList.add('hidden');
          document.getElementById('scan-btn-text').textContent = "カメラを起動してQRを読み取る";
        }).catch(err => console.error(err));
      }
    }

    function onScanSuccess(decodedText) {
      let spotId = parseInt(decodedText.replace(/[^0-9]/g, ''));
      const foundSpot = SPOTS.find(s => s.id === spotId);

      if (!foundSpot) {
        alert("無効なQRコードです。");
        return;
      }

      if (stamps.includes(foundSpot.id)) {
        alert(`「${foundSpot.name}」のスタンプは獲得済みです！`);
        stopScanner();
        return;
      }

      // スタンプ獲得
      stamps.push(foundSpot.id);
      localStorage.setItem('ichijo_festival_stamps', JSON.stringify(stamps));

      // 目的地クリア（一致した場合）
      if (currentTargetId === foundSpot.id) {
        currentTargetId = null;
        localStorage.removeItem('ichijo_festival_target_id');
      }

      // GASへの遅延（ジッター）送信
      sendDataToGAS(foundSpot.name);

      stopScanner();
      alert(`🎉 🎉🎉\n「${foundSpot.name}」のスタンプを獲得しました！`);

      if (stamps.length === 14) {
        setTimeout(() => {
          alert("🎊 おめでとうございます！全14箇所のスタンプをコンプリートしました！特典画面を確認してください！");
        }, 500);
      }

      updateUI();
    }

    function onScanFailure(error) {
      // 読み取り中の軽微なエラーは無視
    }

    // ==========================================
    // 6. GASデータ送信 (1000人規模・ジッター遅延)
    // ==========================================
    function sendDataToGAS(spotName) {
      if (!GAS_URL || GAS_URL.includes("ここに")) return;

      const payload = {
        userName: userName,
        spotName: spotName,
        lapCount: lapCount,
        timestamp: new Date().toLocaleString("ja-JP", { timeZone: "Asia/Tokyo" })
      };

      // 0〜5000ミリ秒（0〜5秒）の間でランダムに分散送信
      const randomDelay = Math.floor(Math.random() * 5000);

      setTimeout(() => {
        fetch(GAS_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        }).then(() => {
          console.log("GAS送信完了:", spotName);
        }).catch(err => {
          console.error("送信エラー（ローカル保持）:", err);
        });
      }, randomDelay);
    }

    // ==========================================
    // 7. スタンプ帳 & 特典描画
    // ==========================================
    function renderStampsGrid() {
      const grid = document.getElementById('stamps-grid');
      grid.innerHTML = '';

      SPOTS.forEach(spot => {
        const isCollected = stamps.includes(spot.id);
        const card = document.createElement('div');
        card.className = `p-3 rounded-xl border flex items-center gap-3 transition-all ${
          isCollected ? 'bg-indigo-50 border-indigo-200 text-indigo-900' : 'bg-slate-50 border-slate-200 text-slate-400 opacity-60'
        }`;

        card.innerHTML = `
          <div class="text-2xl">${spot.emoji}</div>
          <div class="overflow-hidden">
            <div class="font-bold text-xs truncate">${spot.name}</div>
            <div class="text-[10px] ${isCollected ? 'text-indigo-600 font-semibold' : 'text-slate-400'}">
              ${isCollected ? '✓ 獲得済み' : '未獲得'}
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function renderRewards() {
      const statusBox = document.getElementById('reward-status-box');
      if (stamps.length === 14) {
        statusBox.className = "p-4 rounded-xl bg-emerald-500 text-white font-extrabold text-base shadow-lg animate-bounce";
        statusBox.innerHTML = "🎉 コンプリート達成！受付で画面を提示してください！";
      } else {
        statusBox.className = "p-4 rounded-xl bg-slate-100 text-slate-500 font-bold text-sm";
        statusBox.innerHTML = `あと ${14 - stamps.length} 個のスタンプで特典解除！`;
      }
    }

    // ==========================================
    // 8. タブ切り替え & リセット処理
    // ==========================================
    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.getElementById(`tab-${tabName}`).classList.add('active');

      ['mission', 'stamps', 'rewards'].forEach(t => {
        const navBtn = document.getElementById(`nav-${t}`);
        if (t === tabName) {
          navBtn.className = "flex flex-col items-center gap-1 text-indigo-600 font-bold text-xs py-1";
        } else {
          navBtn.className = "flex flex-col items-center gap-1 text-slate-400 font-bold text-xs py-1";
        }
      });
    }

    function resetTestData() {
      if (confirm("テストデータをリセットして最初からやり直しますか？")) {
        localStorage.clear();
        location.reload();
      }
    }
  </script>
</body>
</html>
