<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>文化祭QRスタンプラリー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased pb-20">

    <!-- プレイ前確認モーダル -->
    <div id="welcome-confirm-modal" class="hidden fixed inset-0 bg-slate-900/95 backdrop-blur-md z-[6000] flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm text-center shadow-2xl">
            <h3 class="text-xl font-black text-rose-700 mb-4">⚠️ 始める前のお願い</h3>
            <div class="text-left bg-rose-50 border-2 border-rose-200 rounded-2xl p-4 mb-6">
                <p class="text-sm font-bold text-slate-800 mb-2">LINEやInstagram、iPhoneのコントロールセンターから開いていませんか？</p>
                <p class="text-xs text-rose-700 font-bold mb-3">そのまま遊ぶと、画面を閉じた瞬間に集めたスタンプが消えてしまいます！</p>
                <div class="border-t border-rose-200 pt-3">
                    <p class="text-[11px] text-slate-700 font-bold mb-1">📱 iPhone: 標準カメラで読み取り Safari で開く</p>
                    <p class="text-[11px] text-slate-700 font-bold">📱 Android: 標準カメラ/Googleレンズで Chrome で開く</p>
                </div>
            </div>
            <div class="flex items-center justify-start mb-6 bg-slate-50 p-3 rounded-xl border border-slate-200 text-left">
                <input type="checkbox" id="browser-check" class="w-5 h-5 text-indigo-600 rounded mr-3" onchange="toggleConfirmBtn()">
                <label for="browser-check" class="text-xs font-bold text-slate-700">はい、標準カメラからSafari/Chromeで開いています</label>
            </div>
            <button id="confirm-next-btn" disabled onclick="goToNameInput()" class="bg-slate-300 text-slate-500 w-full py-4 rounded-xl font-bold text-lg transition-colors">確認して次へ</button>
        </div>
    </div>

    <!-- お名前入力モーダル -->
    <div id="name-input-modal" class="hidden fixed inset-0 bg-slate-900/90 backdrop-blur-md z-[5000] flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 w-full max-w-sm text-center shadow-2xl">
            <h3 class="text-xl font-bold text-indigo-900 mb-4">あなたの名前を教えてください</h3>
            <input type="text" id="user-name-input" placeholder="例：一条 太郎" class="w-full bg-slate-50 border-2 border-slate-200 rounded-xl px-4 py-3 mb-4 focus:outline-none focus:border-indigo-500">
            <button onclick="saveName()" class="bg-indigo-600 hover:bg-indigo-700 text-white w-full py-4 rounded-xl font-bold text-lg shadow-md">決定</button>
        </div>
    </div>

    <!-- メインコンテンツ -->
    <div class="max-w-md mx-auto p-4">
        <h1 class="text-2xl font-black text-center text-indigo-900 mb-4">文化祭スタンプラリー</h1>
        <p id="user-greeting" class="text-center text-slate-600 font-bold mb-6"></p>

        <!-- スタンプ状況 -->
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 mb-6 text-center">
            <h2 class="text-lg font-bold text-slate-700 mb-2">現在のスタンプ</h2>
            <p class="text-3xl font-black text-indigo-600"><span id="stamp-count">0</span> / 5</p>
        </div>

        <!-- 目的地・ミッション -->
        <div id="mission-area" class="bg-indigo-50 rounded-2xl p-6 border-2 border-indigo-100 text-center mb-6">
            <h2 class="text-sm font-bold text-indigo-800 mb-2">現在の目的地</h2>
            <div id="current-target-display" class="text-xl font-black text-indigo-900 mb-4">まだ決まっていません</div>
            <button id="lottery-btn" onclick="drawLottery()" class="bg-indigo-600 text-white w-full py-4 rounded-xl font-bold shadow-md">くじを引く！</button>
        </div>
    </div>

    <script>
        // ★★★ ここにご自身のGASのデプロイURLを貼ってください ★★★
        const GAS_URL = "ここにGASのウェブアプリURLを貼る"; 

        const SPOTS = [
            { id: 1, name: "1年1組", emoji: "🎪", desc: "アトラクションを楽しもう！" },
            { id: 2, name: "1年2組", emoji: "☕", desc: "カフェで休憩しよう！" },
            { id: 3, name: "1年3組", emoji: "🎯", desc: "縁日ゲームに挑戦しよう！" },
            { id: 4, name: "1年4組", emoji: "👻", desc: "お化け屋敷に行ってみよう！" },
            { id: 5, name: "1年5組", emoji: "🍔", desc: "美味しいものを食べよう！" },
            { id: 6, name: "1年6組", emoji: "🎨", desc: "展示を楽しもう！" },
            { id: 7, name: "1年7組", emoji: "📸", desc: "写真撮影スポットに行こう！" },
            { id: 8, name: "2年1組", emoji: "🎸", desc: "演奏を聴きに行こう！" },
            { id: 9, name: "2年2組", emoji: "🍿", desc: "ポップコーンを食べよう！" },
            { id: 10, name: "2年3組", emoji: "🎳", desc: "ボーリングに挑戦しよう！" },
            { id: 11, name: "2年4組", emoji: "🍩", desc: "ドーナツを食べよう！" },
            { id: 12, name: "2年5組", emoji: "🎬", desc: "映像作品を見よう！" },
            { id: 13, name: "2年6組", emoji: "🍧", desc: "かき氷を食べよう！" },
            { id: 14, name: "2年7組", emoji: "🎈", desc: "バルーンアートを見よう！" }
        ];

        let userName = localStorage.getItem('ichijo_festival_user_name') || "";
        let stamps = JSON.parse(localStorage.getItem('ichijo_festival_stamps') || "[]");
        let currentTargetId = localStorage.getItem('ichijo_festival_target_id') ? parseInt(localStorage.getItem('ichijo_festival_target_id')) : null;
        let lapCount = parseInt(localStorage.getItem('ichijo_festival_lap_count') || "1");

        // 初期化処理
        window.onload = function() {
            lucide.createIcons();
            if (!userName) {
                document.getElementById('welcome-confirm-modal').classList.remove('hidden');
            } else {
                updateUI();
                checkScan();
            }
        };

        // GASへのデータ送信機能
        function sendDataToGAS(spotName) {
            const payload = {
                userName: userName,
                spotName: spotName,
                lapCount: lapCount
            };

            fetch(GAS_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            }).catch(err => console.error("送信エラー:", err));
        }

        function toggleConfirmBtn() {
            const isChecked = document.getElementById('browser-check').checked;
            const btn = document.getElementById('confirm-next-btn');
            if (isChecked) {
                btn.disabled = false;
                btn.className = "bg-indigo-600 text-white hover:bg-indigo-700 w-full py-4 rounded-xl font-bold text-lg shadow-md transition-colors";
            } else {
                btn.disabled = true;
                btn.className = "bg-slate-300 text-slate-500 cursor-not-allowed w-full py-4 rounded-xl font-bold text-lg transition-colors";
            }
        }

        function goToNameInput() {
            document.getElementById('welcome-confirm-modal').classList.add('hidden');
            document.getElementById('name-input-modal').classList.remove('hidden');
        }

        function saveName() {
            const input = document.getElementById('user-name-input').value.trim();
            if (input) {
                userName = input;
                localStorage.setItem('ichijo_festival_user_name', userName);
                document.getElementById('name-input-modal').classList.add('hidden');
                updateUI();
            }
        }

        // 完全ランダムなくじ引き処理
        function drawLottery() {
            const availableSpots = SPOTS.filter(spot => !stamps.includes(spot.id));
            if (availableSpots.length === 0) {
                alert("すべてのスタンプを獲得済みです！");
                return;
            }
            const randomIndex = Math.floor(Math.random() * availableSpots.length);
            const selectedSpot = availableSpots[randomIndex];

            currentTargetId = selectedSpot.id;
            localStorage.setItem('ichijo_festival_target_id', selectedSpot.id);
            updateUI();
        }

        // URLからのQRスキャン判定
        function checkScan() {
            const urlParams = new URLSearchParams(window.location.search);
            const scannedSpotId = parseInt(urlParams.get('spot'));
            
            if (scannedSpotId) {
                if (stamps.includes(scannedSpotId)) {
                    alert("このスタンプはすでに獲得済みです！");
                } else if (currentTargetId !== scannedSpotId) {
                    alert("くじ引きで指定された目的地ではありません！");
                } else {
                    // スタンプ獲得成功
                    stamps.push(scannedSpotId);
                    localStorage.setItem('ichijo_festival_stamps', JSON.stringify(stamps));
                    
                    const spotInfo = SPOTS.find(s => s.id === scannedSpotId);
                    sendDataToGAS(spotInfo.name); // GASへ送信

                    localStorage.removeItem('ichijo_festival_target_id');
                    currentTargetId = null;
                    
                    alert(`${spotInfo.name}のスタンプを獲得しました！`);
                    
                    // URLのパラメータを消してリロード
                    window.location.href = window.location.pathname; 
                }
            }
        }

        function updateUI() {
            document.getElementById('user-greeting').innerText = `${userName} さん（${lapCount}周目）`;
            document.getElementById('stamp-count').innerText = stamps.length;

            const btn = document.getElementById('lottery-btn');
            const targetDisplay = document.getElementById('current-target-display');

            if (currentTargetId) {
                const targetSpot = SPOTS.find(s => s.id === currentTargetId);
                targetDisplay.innerHTML = `${targetSpot.emoji} ${targetSpot.name}<br><span class="text-sm">${targetSpot.desc}</span>`;
                btn.classList.add('hidden');
            } else {
                targetDisplay.innerText = "まだ決まっていません";
                btn.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
